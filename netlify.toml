[build]
  command = "next build"
  publish = "out"
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://opinonion.netlify.app; connect-src 'self' https://opinonion.netlify.app https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com https://*.analytics.google.com; img-src 'self' data: https://www.google-analytics.com https://www.googletagmanager.com https://*.google-analytics.com; frame-src https://www.google.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Let browsers keep images for a week instead of re-downloading them on every
# visit (they were served with max-age=0). Not "immutable": some images are
# replaced in place under the same file name, so a week is the most a returning
# visitor could see an old version. The Netlify edge cache resets on every deploy.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The room addition case study moved from /guides to /projects on 2026-09-25.
# 301 so the old URL keeps working and hands its signals to the new one.
[[redirects]]
  from = "/guides/room-addition-case-study"
  to = "/projects/room-addition-case-study"
  status = 301
  force = true
